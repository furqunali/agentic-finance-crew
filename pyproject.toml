[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-finance-crew"
version = "1.0.0"
description = "Multi-agent CrewAI system for finance/ops expense approvals with a policy guardrail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Furqan Ali" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Optional engines — kept out of the base install so the demo and CI stay light
# and run with zero API keys.
#   pip install -e ".[crewai]"     # real multi-agent CrewAI crew (needs a key)
#   pip install -e ".[langgraph]"  # LangGraph state-graph engine (no key needed)
crewai = ["crewai>=0.70"]
langgraph = ["langgraph>=0.2"]
dev = ["pytest>=8", "httpx>=0.27", "langgraph>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
