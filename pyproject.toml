[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-finance-crew"
version = "1.0.0"
description = "Multi-agent CrewAI system for finance/ops expense approvals with a policy guardrail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Furqan Ali" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# The real multi-agent engine. Optional so the demo, tests and CI stay light
# and run with zero API keys. Install with:  pip install -e ".[crewai]"
crewai = ["crewai>=0.70"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
