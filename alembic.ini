# Alembic configuration for Agentic Finance Crew.
#
# The database URL is NOT stored here — env.py reads it from the DATABASE_URL
# environment variable so the same migrations run against SQLite (dev/CI) or
# PostgreSQL (production) with no file edits and no secrets in the repo.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is intentionally left blank; env.py injects DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
