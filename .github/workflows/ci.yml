name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (base + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q
      - name: Smoke-test the CLI demo (local engine, no keys)
        run: python run_demo.py

  postgres:
    name: Postgres integration (migrations + persistence)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_crew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finance_crew
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (base + dev + postgres driver)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Apply migrations to Postgres
        run: alembic upgrade head
      - name: Persist + read back a decision against Postgres
        run: |
          python - <<'PY'
          from finance_crew.db import session_scope
          from finance_crew.service import decide_and_store
          from finance_crew import repository
          with session_scope() as s:
              _, rid = decide_and_store(s, {"id": "PG-1", "employee": "CI",
                  "category": "software", "amount": 149, "has_receipt": True})
          with session_scope() as s:
              rec = repository.get_by_request_id(s, "PG-1")
              assert rec and rec.decision == "auto_approved", rec
              print("Postgres round-trip OK -> record", rid, rec.decision)
          PY

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentic-finance-crew:ci .
      - name: Start container & check /health
        run: |
          docker run -d --name afc -p 8000:8000 agentic-finance-crew:ci
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/health; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs afc; exit 1
